<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Reply</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-size: cover;
            animation: backgroundSlide 10s infinite;
        }
        
        @keyframes backgroundSlide {
            0% { background: url(WhatsApp\ Image\ 2025-02-12\ at\ 21.11.20_c4c2bd00.jpg) no-repeat center center/cover; }
            50% { background: url(WhatsApp\ Image\ 2025-02-12\ at\ 21.11.21_0d7e7744.jpg) no-repeat center center/cover; }
            100% { background: url(WhatsApp\ Image\ 2025-02-12\ at\ 21.11.23_a98722b5.jpg) no-repeat center center/cover; }
        }
        
        .reply-container {
            background: rgba(255, 255, 255, 0.7);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        textarea {
            width: 300px;
            height: 100px;
            padding: 10px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        
        .submit-button, .back-button {
            margin-top: 10px;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #ff4081;
            color: white;
        }
    </style>
</head>
<body>
    <iframe src="audio.html" allow="autoplay" style="display: none;"></iframe>

    <div class="reply-container">
        <h2>Your Reply</h2>
        <textarea id="userReply" placeholder="Write your message here... for you boyfriend"></textarea>
        <br>
        <button class="submit-button" onclick="submitReply()">Submit</button>
        <button class="back-button" onclick="location.href='index2.html'">Go Back</button>
    </div>

    <script>
        function submitReply() {
            let reply = document.getElementById("userReply").value;
            if (reply.trim() !== "") {
                localStorage.setItem("userMessage", reply);
                alert("Your message has been saved!");
                document.getElementById("userReply").value = "";
            } else {
                alert("Please write something before submitting!");
            }
        }
    </script>
</body>
</html>
