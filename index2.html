<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Greeting</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            background-size: cover;
            animation: backgroundSlide 10s infinite;
        }
        
        @keyframes backgroundSlide {
            0% { background: url(WhatsApp\ Image\ 2025-02-12\ at\ 21.11.26_d935d81e.jpg) no-repeat center center/cover; }
            50% { background: url(WhatsApp\ Image\ 2025-02-12\ at\ 21.11.25_047bbc10.jpg) no-repeat center center/cover; }
            100% { background: url(WhatsApp\ Image\ 2025-02-12\ at\ 21.11.22_caa19bac.jpg) no-repeat center center/cover; }
        }
        
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            padding: 10px;
            text-align: center;
            z-index: 20;
        }
        .header button {
            margin: 5px;
            padding: 10px 15px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #ff4081;
            color: white;
        }
        .popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.8);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
        }
        .popup img {
            max-width: 250px;
            border-radius: 10px;
            height: 300px;
            opacity: 0.8;
        }
        .flowers {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .flower {
            position: absolute;
            width: 30px;
            height: 30px;
            background: url('flowers.jpg') no-repeat center center/cover;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); }
            100% { transform: translateY(100vh) rotate(360deg); }
        }
        
        .confession-button {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ff4081;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- <audio autoplay loop>
        <source src="(DJJOhAL.Com).mp3" type="audio/mp3">
    </audio> -->
    <iframe src="audio.html" allow="autoplay" style="display: none;"></iframe>

    
    <div class="header">
        <button onclick="location.href='life_image.html'">Life Image</button>
        <button onclick="location.href='your_reply.html'">Your Reply</button>
        <button onclick="showConfession()">Confession</button>
    </div>
    
    <div class="popup">
        <h2>Special Message for You!</h2>
        <p>You are my love charger 🌸 you love me = i love you</p>
        <img src="WhatsApp Image 2025-02-12 at 21.11.25_047bbc10.jpg" alt="Special Person">
    </div>
    
    <div class="flowers"></div>
    
    <script>
        function createFlower() {
            const flower = document.createElement("div");
            flower.classList.add("flower");
            flower.style.left = Math.random() * 100 + "vw";
            flower.style.animationDuration = (Math.random() * 2 + 3) + "s";
            document.querySelector(".flowers").appendChild(flower);
            setTimeout(() => flower.remove(), 5000);
        }
        setInterval(createFlower, 600);
        
        function showConfession() {
            alert("I have something to confess... I truly appreciate you! 💖");
        }

    </script>
</body>
</html>
